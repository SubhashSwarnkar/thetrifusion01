name: SEO Audit

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and SEO audit
        run: npm run ci:seo
        env:
          NEXT_PUBLIC_SITE_URL: https://www.thetrifusion.in
