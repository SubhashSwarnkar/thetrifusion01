<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset -->
    <meta charset="utf-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />

    <!-- DevTools Protection -->
    <style>
      /* Prevent text selection */
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      /* Allow text selection for input and textarea */
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
    </style>
    <script>
      // Early DevTools Protection - Runs before React loads
      (function() {
        'use strict';
        
        // Block right-click immediately
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }, true);
        
        // Block keyboard shortcuts immediately
        document.addEventListener('keydown', function(e) {
          // F12
          if (e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+Shift+K, Ctrl+Shift+E
          if (e.ctrlKey && e.shiftKey && [73, 74, 67, 75, 69].includes(e.keyCode)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+U, Ctrl+S, Ctrl+P
          if (e.ctrlKey && [85, 83, 80].includes(e.keyCode)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
        
        // Block text selection
        document.addEventListener('selectstart', function(e) {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            return false;
          }
        }, true);
        
        // Block drag start
        document.addEventListener('dragstart', function(e) {
          e.preventDefault();
          return false;
        }, true);
      })();
    </script>

    <!-- SEO is managed by react-helmet-async in SEO.js -->

    <!-- Favicon & Apple Icon -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD for Business Info) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TheTrifusion",
        "url": "https://thetrifusion.com/",
        "logo": "https://thetrifusion.com/logo.svg",
        "sameAs": [
          "https://www.facebook.com/thetrifusion",
          "https://www.linkedin.com/company/thetrifusion",
          "https://twitter.com/thetrifusion"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-9799995083",
          "contactType": "Customer Support",
          "areaServed": "IN",
          "availableLanguage": ["English", "Hindi"]
        }
      }
    </script>

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-NQYLHS3XP9"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-NQYLHS3XP9");
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
